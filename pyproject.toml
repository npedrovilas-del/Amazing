[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Maze generation library for the A-Maze-ing 42 project"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "pneto-vi"},
    {name = "nfardim"},
]
dependencies = []

[project.optional-dependencies]
dev = [
    "flake8",
    "mypy",
    "build",
]

[tool.setuptools.packages.find]
include = ["mazegen*"]
